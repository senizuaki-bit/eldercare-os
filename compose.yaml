name: eldercare-os

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: eldercare
      POSTGRES_USER: eldercare
      POSTGRES_PASSWORD: eldercare_dev_only
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eldercare -d eldercare']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:8.2.1-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: eldercare_dev
      MINIO_ROOT_PASSWORD: eldercare_dev_only
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: ['setup']
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "mc alias set local http://minio:9000 eldercare_dev eldercare_dev_only &&
      mc mb --ignore-existing local/eldercare-private &&
      mc anonymous set none local/eldercare-private &&
      mc ilm rule import local/eldercare-private < /config/voice-lifecycle.json &&
      mc ilm rule ls local/eldercare-private"
    volumes:
      - ./infra/docker/minio/voice-lifecycle.json:/config/voice-lifecycle.json:ro
    restart: 'no'

  mosquitto:
    image: eclipse-mosquitto:2.0.22
    ports:
      - '127.0.0.1:1883:1883'
    volumes:
      - ./infra/docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ['CMD-SHELL', "mosquitto_sub -h localhost -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null 2>&1"]
      interval: 5s
      timeout: 4s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
  mosquitto-data:
